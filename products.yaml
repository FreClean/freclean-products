# FreClean Product Catalog
#
# This file is the source of truth for FreClean's product data. freclean-api
# and freclean-website should read from (or be seeded from) this file rather
# than duplicating product facts. Validate with `npm run validate` before
# merging any change; see validate-catalog.ts.
#
# lifecycleStatus meanings:
#   development   - formulation/design in progress, not yet produced
#   prototype     - a working sample exists, not yet sold
#   available     - verified in stock and sold to customers
#   discontinued  - no longer produced or sold
#   planned       - intended for the future, not started

